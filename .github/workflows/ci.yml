name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: FFmpeg for the real-conversion tests and the converter self-test
        run: choco install ffmpeg --no-progress -y
      - name: Unit, localisation, security and real-conversion tests
        run: npm test
      - name: Electron self-test (real renderer, welcome/family/update windows, converter, layout in 20 languages)
        run: npm run selftest
